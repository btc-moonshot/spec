name: Verify Spec Checker, v0 Immutability & Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable v0 SHA-256 manifest
        run: (cd versions/v0 && sha256sum -c SHA256SUMS.txt)
      - name: Run v1 consistency & bounds checker
        run: python3 -I scripts/verify_spec_bounds.py
      - name: Check for leaked local filesystem paths
        run: |
          if grep -rn "/Users/" SPEC.md CHANGELOG.md spec/ scripts/ versions/v0/SPEC.md versions/v0/spec/ versions/v0/scripts/ public/llms.txt public/llms-full.txt; then
            echo "ERROR: Local filesystem path detected!"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify synced raw files and llms-full.txt
        run: |
          npm run sync:spec
          git diff --exit-code public/raw public/llms-full.txt
      - name: Build Astro specification site
        run: npm run build
